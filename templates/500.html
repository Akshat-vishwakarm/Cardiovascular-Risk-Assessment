{% extends "base.html" %}

{% block title %}Server Error - GeneGuard{% endblock %}

{% block content %}
<section class="result-card" style="padding: 4rem 2rem;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
    <h1 style="font-size: 2rem; color: var(--primary-navy); margin-bottom: 0.5rem;">Something went wrong</h1>
    <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem;">
        We couldn't process your assessment. Please check your information and try again.
    </p>
    <a href="/" class="btn-submit" style="display: inline-flex; width: auto; padding: 0.85rem 2rem;">
        Try Again
    </a>
</section>
{% endblock %}
